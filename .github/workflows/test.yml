name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # requirement:native-and-wasm-targets — every package keeps building on
      # the wasm targets and on a 32-bit arch (catches bare-int assumptions).
      - name: Build js/wasm
        run: GOOS=js GOARCH=wasm go build ./...
      - name: Build wasip1/wasm
        run: GOOS=wasip1 GOARCH=wasm go build ./...
      - name: Build linux/386
        run: GOOS=linux GOARCH=386 go build ./...
