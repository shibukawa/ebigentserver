name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Ebitengine compiles against X11/OpenGL/ALSA headers on Linux even
      # when nothing ever opens a window, so vetting any package that
      # imports it needs these dev packages on the runner.
      - name: Install Ebitengine build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev pkg-config
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # Each tutorial step is its own module, which is what lets step 2 run
      # `ebigent init` the way a reader does. `./...` stops at a module
      # boundary, so the root job above never enters them and each one is
      # built, vetted, and tested on its own. The replace directive in every
      # step's go.mod points back at this checkout, so they test the code in
      # the pull request rather than a published version.
      - name: Test the tutorial modules
        run: |
          for step in tutorial/step*/; do
            echo "::group::$step"
            (cd "$step" && go vet ./... && go test ./...)
            echo "::endgroup::"
          done
      # requirement:native-and-wasm-targets — every package that can end up in
      # a game keeps building for the browser (js/wasm), where a game runs as
      # standalone or as a WebRTC listen host (concept:static-host-mode).
      # Servers are native-only: wasip1 has no net.Listen so a wasm dedicated
      # server was never runnable, and the engine-free guarantee is enforced
      # directly by importcheck, not by a build matrix. The toolchain (cli,
      # cmd/ebigent) is a host tool and never a concept:build-target: it runs
      # on a developer machine, so its terminal UI has no reason to compile
      # for a browser. A tutorial step that offers LAN play is native too:
      # api:lan-preset needs a listening socket and udp broadcast, and a
      # browser has neither — its rules packages still build here.
      - name: Build js/wasm
        run: GOOS=js GOARCH=wasm go build $(go list ./... | grep -v -e '/cli$' -e '/cmd/ebigent$' -e '^github.com/shibukawa/ebigentserver$')
      # The same guarantee for the tutorial modules, one module at a time.
      # A step that offers LAN play is excluded by its own module path,
      # which is the entry point; the rules and wire packages under it
      # still have to build for the browser.
      - name: Build js/wasm (tutorial modules)
        run: |
          for step in tutorial/step*/; do
            echo "::group::$step"
            (
              cd "$step"
              pkgs=$(go list ./... | grep -v -e '/step2-lobby$' -e '/step3-record$' -e '/step4-distill$' -e '/step5-simulate$')
              GOOS=js GOARCH=wasm go build $pkgs
            )
            echo "::endgroup::"
          done
