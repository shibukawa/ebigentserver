name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # requirement:native-and-wasm-targets — every package that can end up in
      # a game keeps building for the browser (js/wasm), where a game runs as
      # standalone or as a WebRTC listen host (concept:static-host-mode).
      # Servers are native-only: wasip1 has no net.Listen so a wasm dedicated
      # server was never runnable, and the engine-free guarantee is enforced
      # directly by importcheck, not by a build matrix. The toolchain (cli,
      # cmd/ebigent) is a host tool and never a concept:build-target: it runs
      # on a developer machine, so its terminal UI has no reason to compile
      # for a browser.
      - name: Build js/wasm
        run: GOOS=js GOARCH=wasm go build $(go list ./... | grep -v -e '/cli$' -e '/cmd/ebigent$' -e '^github.com/shibukawa/ebigentserver$')
